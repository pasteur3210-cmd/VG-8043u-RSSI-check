name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Verify version and source
        shell: pwsh
        run: |
          python -c "from rssi_core import VERSION; assert VERSION == '1.0.4'"
          git rev-parse HEAD
      - name: Build
        run: |
          python -m pip install -r requirements.txt
          pyinstaller --noconfirm --clean --onefile --windowed --name VG8043_RSSI_V1.0.4 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: VG8043_RSSI_V1.0.4
          path: dist/VG8043_RSSI_V1.0.4.exe
